spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/memorias}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 300MB
      # Five videos of 300 MB plus multipart fields and headers.
      max-request-size: 1505MB

memorias:
  admin-user: ${ADMIN_USER:admin}
  admin-password: ${ADMIN_PASSWORD:}
  storage:
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:memorias}
    directory: ${STORAGE_DIRECTORY:./local-data/files}

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: ${SECURE_COOKIES:true}
        same-site: strict

