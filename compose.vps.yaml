# Use com: docker compose -f compose.yaml -f compose.vps.yaml up -d --build
# O HTTPS e o domínio são atendidos pelo proxy já existente na VPS.
x-vps-logging: &vps-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    restart: unless-stopped
    logging: *vps-logging

  minio:
    restart: unless-stopped
    logging: *vps-logging

  create-bucket:
    restart: "no"
    logging: *vps-logging

  api:
    restart: unless-stopped
    logging: *vps-logging
    environment:
      SECURE_COOKIES: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: native

  portal:
    restart: unless-stopped
    logging: *vps-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/collections"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
