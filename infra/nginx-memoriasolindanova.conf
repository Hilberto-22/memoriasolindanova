# Bloco inicial para Nginx instalado diretamente na VPS.
# Depois de ativá-lo, emita e instale o certificado com seu gerenciador de TLS.
# Com Certbot: certbot --nginx -d memoriasolindanova.com.br --redirect
server {
    listen 80;
    server_name memoriasolindanova.com.br;
    client_max_body_size 105m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
        proxy_read_timeout 120s;
    }
}
