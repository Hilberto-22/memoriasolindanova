<dialog #dialog (close)="dialog.returnValue === 'yes' && confirmed.emit()">
    <h2>{{title()}}</h2><p>{{message()}}</p><div class="actions">
      <button class="button outline" type="button" (click)="dialog.close('no')" autofocus>Cancelar</button>
      <button class="button" type="button" (click)="dialog.close('yes')">Confirmar</button>
    </div>
  </dialog><button class="button" type="button" (click)="dialog.returnValue = ''; dialog.showModal()">{{action()}}</button>
