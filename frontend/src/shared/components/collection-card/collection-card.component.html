<a class="collection-tile" routerLink="/acervo" [queryParams]="{collection:item().slug}">
  @if (item().imageUrl) {<img loading="lazy" [src]="item().imageUrl" alt="">}
  <div class="collection-copy">
    <portal-icon [name]="icon()"/>
    <h3>{{item().title}}</h3>
    @if (item().description) {<p>{{item().description}}</p>}
    <small>{{item().count}} {{item().count === 1 ? 'registro' : 'registros'}}</small>
  </div>
</a>
