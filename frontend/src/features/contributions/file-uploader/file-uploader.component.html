<label>Arquivos
    <input #picker type="file" multiple accept=".jpeg,.jpg,.png,.webp,.pdf,.mp3,.wav,.mp4" (change)="select(picker)">
  </label><p class="muted">Até cinco arquivos. Vídeos MP4 de até 300 MB cada; JPEG, PNG, WebP, PDF, MP3 ou WAV de até 20 MB cada.</p>
  @if (error()) {<p class="error" role="alert">{{error()}}</p>}
  @if (names().length) {<ul>@for (name of names(); track $index) {<li>{{name}}</li>}</ul>}
